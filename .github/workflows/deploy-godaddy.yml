name: Deploy to GoDaddy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      # The game is Android-only: play.kallistesoft.ca only serves a "coming to Google Play" page.
      # Deploying it removes the old web build (the FTP deploy deletes files it uploaded before).
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web_closed

  deploy:
    needs: build
    uses: kallistesoft/kallistesoft-site/.github/workflows/deploy-ftp.yml@main
    with:
      folder: play.kallistesoft.ca
    secrets: inherit
